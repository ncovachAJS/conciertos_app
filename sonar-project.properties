sonar.projectKey=ncovachAJS_conciertos_app
sonar.projectName=Conciertos App
sonar.projectVersion=1.0
sonar.organization=ncovachajs-1

# Fuentes
sonar.sources=lib
sonar.tests=test

# Exclusiones de análisis — código generado, assets, firebase
sonar.exclusions=\
  lib/**/*.g.dart,\
  lib/firebase_options.dart,\
  lib/l10n/generated/**,\
  lib/**/setlist_test_page.dart

sonar.test.exclusions=\
  test/widget_test.dart,\
  test/integration_test.dart

# Cobertura (generada por flutter test --coverage)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura:
# - Código generado
# - Capa de presentación (widgets, pages, controllers, views) → requiere widget tests, no unit tests
# - Servicios de red (API services, repositories) → dependen de HTTP/Firebase
# - App shell, routing, inicialización
# - Shared widgets
sonar.coverage.exclusions=\
  lib/**/*.g.dart,\
  lib/firebase_options.dart,\
  lib/l10n/generated/**,\
  lib/**/setlist_test_page.dart,\
  lib/main.dart,\
  lib/app/**,\
  lib/core/initialization/**,\
  lib/core/tutorial/**,\
  lib/shared/**,\
  lib/**/presentation/**,\
  lib/**/data/services/**,\
  lib/**/data/repositories/**,\
  lib/**/providers/**

# Encoding
sonar.sourceEncoding=UTF-8
