sonar.projectKey=ncovachAJS_conciertos_app
sonar.projectName=Conciertos App
sonar.projectVersion=1.0
sonar.organization=ncovachajs-1

# Fuentes
sonar.sources=lib
sonar.tests=test

# Exclusiones de análisis — código generado, assets, firebase, páginas de prueba
sonar.exclusions=\
  lib/**/*.g.dart,\
  lib/firebase_options.dart,\
  lib/l10n/generated/**,\
  lib/**/setlist_test_page.dart

sonar.test.exclusions=\
  test/widget_test.dart,\
  test/integration_test.dart

# Cobertura (generada por flutter test --coverage)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Exclusiones de cobertura:
# - Código generado
# - App shell, routing, inicialización, tutorial
# - Tema visual y constantes (colores, espaciado, tipografía)
# - Constantes y configuración (urls, límites Pro, países)
# - Capa de presentación (widgets, pages, controllers) → requiere widget tests
# - Servicios de datos (HTTP, Firebase, SharedPreferences) → dependen de I/O externo
# - Repositorios e interfaces abstractas
# - Modelos/entidades de features externas (import, setlist, spotify, ticketmaster)
# - Photos, recommendations: dependen de servicios externos complejos
sonar.coverage.exclusions=\
  lib/**/*.g.dart,\
  lib/firebase_options.dart,\
  lib/l10n/generated/**,\
  lib/**/setlist_test_page.dart,\
  lib/main.dart,\
  lib/app/**,\
  lib/config/**,\
  lib/core/config/**,\
  lib/core/constants/**,\
  lib/core/initialization/**,\
  lib/core/theme/**,\
  lib/core/tutorial/**,\
  lib/shared/**,\
  lib/**/presentation/**,\
  lib/**/data/services/**,\
  lib/**/data/repositories/**,\
  lib/**/providers/**,\
  lib/**/domain/repositories/**,\
  lib/features/friends_activity/data/**,\
  lib/features/home/data/**,\
  lib/features/import/**,\
  lib/features/photos/**,\
  lib/features/recommendations/**,\
  lib/features/setlist/**,\
  lib/features/spotify/**,\
  lib/features/statistics/data/**,\
  lib/features/ticketmaster/**

# Exclusiones de duplicación:
# Los test files y archivos generados tienen patrones repetitivos propios.
sonar.cpd.exclusions=test/**

# Encoding
sonar.sourceEncoding=UTF-8
