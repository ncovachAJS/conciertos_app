name: conciertos_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_dotenv: ^5.1.0
  http: ^1.5.0
  image_picker: ^1.1.2
  go_router: ^17.3.0
  flutter_riverpod: ^3.3.2
  google_fonts: ^8.1.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  flutter_animate: ^4.5.2
  audioplayers: ^6.5.0
  flutter_secure_storage: ^9.2.2
  palette_generator: ^0.3.3+6
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  firebase_crashlytics: ^4.0.0
  http_parser: ^4.1.2
  timeago: ^3.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  add_2_calendar: ^3.1.1
  flutter_cache_manager: ^3.4.2
  flutter_web_auth_2: ^4.0.1   # OAuth WebView para Spotify
  crypto: ^3.0.6                # SHA-256 para PKCE
  geolocator: ^13.0.2           # GPS para "conciertos cerca de ti"
  webview_flutter: ^4.10.0      # Embed de Spotify (top canciones)
  webview_flutter_wkwebview: ^3.19.1  # iOS WebKit params (inline audio)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/imports/
    - assets/icon/
    - assets/audio/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true