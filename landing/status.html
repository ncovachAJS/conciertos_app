<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estado de Servicios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Dark-first — matches app palette: accent orange, green, gold */
:root {
  --bg:        #090909;
  --bg-card:   #111113;
  --bg-hover:  #17171a;
  --border:    rgba(255,255,255,.07);
  --fg:        #f0ede8;
  --fg-muted:  #7a7672;
  --accent:    #e8491a;
  --green:     #22c97b;
  --gold:      #c9a227;
  --red:       #e05252;
  --yellow:    #e0a830;
  --font:      'Inter', system-ui, sans-serif;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100%;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}
.header-left { display: flex; flex-direction: column; gap: 4px; }
.app-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  font-size: clamp(22px, 5vw, 30px);
  font-weight: 800;
  letter-spacing: -.02em;
  text-wrap: balance;
}
.last-updated {
  font-size: 12px;
  color: var(--fg-muted);
  margin-top: 2px;
}

.btn-refresh {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: background .15s, border-color .15s;
  white-space: nowrap;
}
.btn-refresh:hover { background: var(--bg-hover); border-color: rgba(255,255,255,.14); }
.btn-refresh svg { transition: transform .5s; }
.btn-refresh.spinning svg { transform: rotate(360deg); }

/* ── Global pill ── */
.global-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 28px;
}
.global-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  flex-shrink: 0;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
}
.global-text { font-size: 14px; font-weight: 600; }
.global-sub  { font-size: 12px; color: var(--fg-muted); margin-left: auto; }

/* ── Grid ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ── Card ── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: background .15s;
  text-decoration: none;
  color: inherit;
}
.card:hover { background: var(--bg-hover); }

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.card-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
}
.card-role {
  font-size: 11px;
  color: var(--fg-muted);
  font-weight: 500;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-pill .dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* status variants */
.s-ok     { background: rgba(34,201,123,.12); color: var(--green); }
.s-ok .dot     { background: var(--green); box-shadow: 0 0 5px var(--green); }
.s-minor  { background: rgba(224,168,48,.12); color: var(--yellow); }
.s-minor .dot  { background: var(--yellow); }
.s-major  { background: rgba(232,73,26,.12); color: var(--accent); }
.s-major .dot  { background: var(--accent); }
.s-critical { background: rgba(224,82,82,.12); color: var(--red); }
.s-critical .dot { background: var(--red); }
.s-unknown { background: rgba(122,118,114,.1); color: var(--fg-muted); }
.s-unknown .dot { background: var(--fg-muted); }

.card-desc {
  font-size: 13px;
  color: var(--fg-muted);
  min-height: 20px;
}
.card-link {
  font-size: 12px;
  color: var(--fg-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: auto;
  text-decoration: none;
  width: fit-content;
  transition: color .15s;
}
.card-link:hover { color: var(--fg); }
.card-link svg { flex-shrink: 0; }

/* loading shimmer */
.shimmer {
  background: linear-gradient(90deg, var(--bg-hover) 25%, rgba(255,255,255,.04) 50%, var(--bg-hover) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 6px;
  height: 14px;
  width: 120px;
}
@keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

/* ── Extra sections (UTR, billing, usage) ── */
.extra-section {
  margin-top: 32px;
  border-top: 1px solid var(--border);
  padding-top: 24px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-muted);
  letter-spacing: .05em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.section-form { display: flex; gap: 8px; flex-wrap: wrap; }
.section-form.col { flex-direction: column; }
.field-label { font-size: 11px; font-weight: 600; color: var(--fg-muted); margin-bottom: 4px; letter-spacing: .06em; text-transform: uppercase; }
.field-group { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
.s-input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  padding: 9px 13px;
  border-radius: 10px;
  outline: none;
  transition: border-color .15s;
  width: 100%;
}
.s-input:focus { border-color: rgba(255,255,255,.2); }
.s-input::placeholder { color: var(--fg-muted); }
.btn-load {
  background: var(--accent);
  color: #fff;
  border: none;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 700;
  padding: 9px 16px;
  border-radius: 10px;
  cursor: pointer;
  transition: opacity .15s;
  align-self: flex-end;
}
.btn-load:hover { opacity: .85; }

/* Usage bars (Cloudinary) */
.usage-display { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.usage-row { display: flex; flex-direction: column; gap: 4px; }
.usage-row-top { display: flex; justify-content: space-between; font-size: 12px; }
.usage-label { font-weight: 600; }
.usage-val { color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.usage-track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
.usage-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s; }
.usage-fill.green { background: var(--green); }
.usage-fill.gold  { background: var(--gold); }
.usage-msg { font-size: 12px; color: var(--fg-muted); padding: 8px 0; }

/* Billing countdown */
.billing-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.billing-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.billing-service { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }
.billing-date { font-size: 15px; font-weight: 700; }
.billing-countdown { font-size: 28px; font-weight: 800; letter-spacing: -.02em; color: var(--accent); }
.billing-countdown.ok { color: var(--green); }
.billing-sub { font-size: 12px; color: var(--fg-muted); }
.billing-day-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--fg-muted); }
.billing-day-row input[type=number] {
  width: 52px;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--border);
  color: var(--fg);
  font-family: var(--font);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 6px;
  outline: none;
  text-align: center;
}

@media (max-width: 600px) {
  .section-form { flex-direction: column; }
  .field-group { min-width: 0; }
  .btn-load { align-self: stretch; font-size: 15px; padding: 12px; }
  .billing-cards { grid-template-columns: 1fr; }
  .billing-countdown { font-size: 36px; }
}

/* ── App Stats ── */
.stats-kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kpi-label { font-size: 11px; font-weight: 600; color: var(--fg-muted); letter-spacing: .07em; text-transform: uppercase; }
.kpi-value { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.kpi-sub   { font-size: 11px; color: var(--fg-muted); }
.kpi-value.green { color: var(--green); }
.kpi-value.gold  { color: var(--gold); }
.kpi-value.accent { color: var(--accent); }

.stats-users-list { margin-top: 16px; }
.stats-users-title { font-size: 12px; font-weight: 700; color: var(--fg-muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
.user-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.user-row:last-child { border-bottom: none; }
.user-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  object-fit: cover;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: var(--fg-muted);
  overflow: hidden;
}
.user-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.user-info { flex: 1; min-width: 0; }
.user-name  { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-email { font-size: 11px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-badge {
  font-size: 10px; font-weight: 700; letter-spacing: .05em;
  padding: 2px 7px; border-radius: 20px;
  background: rgba(201,162,39,.15); color: var(--gold);
  flex-shrink: 0;
}
.user-badge.admin { background: rgba(232,73,26,.15); color: var(--accent); }
.user-concerts { font-size: 11px; color: var(--fg-muted); flex-shrink: 0; }
.user-stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.user-stat { font-size: 11px; color: var(--fg-muted); display: flex; align-items: center; gap: 3px; }
.user-version { font-size: 11px; font-weight: 600; color: var(--fg-muted); margin-top: 3px; }
.user-search { width: 100%; background: rgba(255,255,255,.05); border: 1px solid var(--border); border-radius: 10px; color: var(--fg); font-family: var(--font); font-size: 14px; padding: 10px 14px; outline: none; margin-bottom: 12px; }
.user-search:focus { border-color: var(--accent); }

/* Versions grid */
.versions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
.version-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.version-num { font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.version-build { font-size: 11px; color: var(--fg-muted); }
.version-devices { font-size: 11px; font-weight: 600; color: var(--fg-muted); margin-top: 2px; }

/* Cloudinary card */
.cld-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 20px;
  margin-top: 14px;
}
.cld-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cld-card-title { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-muted); }

.stats-signup-chart { margin-top: 16px; }
.chart-bars { display: flex; align-items: flex-end; gap: 3px; height: 60px; }
.chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.chart-bar { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; opacity: .8; transition: opacity .15s; }
.chart-bar:hover { opacity: 1; }
.chart-label { font-size: 9px; color: var(--fg-muted); text-align: center; white-space: nowrap; }

@media (max-width: 600px) {
  body { font-size: 17px; padding-block: 20px; }

  .header { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 24px; }
  .btn-refresh { width: 100%; justify-content: center; font-size: 15px; padding: 13px 16px; }
  h1 { font-size: 26px; }
  .app-label { font-size: 12px; }
  .last-updated { font-size: 13px; }

  .global-bar { padding: 16px 18px; gap: 12px; }
  .global-dot { width: 14px; height: 14px; }
  .global-text { font-size: 16px; }
  .global-sub { display: none; }

  .grid { grid-template-columns: 1fr; gap: 12px; }

  .card { padding: 20px; gap: 14px; }
  .card-name { font-size: 18px; }
  .card-role { font-size: 13px; }
  .card-desc { font-size: 15px; }
  .card-link { font-size: 14px; }

  .status-pill { font-size: 14px; padding: 6px 13px; }
  .status-pill .dot { width: 9px; height: 9px; }

  .section-title { font-size: 15px; }
  .s-input { min-width: 0; font-size: 15px; padding: 12px 14px; }
  .btn-load { font-size: 15px; padding: 12px 16px; }
  .stats-kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .kpi-value { font-size: 28px; }
  .billing-cards { grid-template-columns: 1fr; }
  .billing-countdown { font-size: 36px; }
}
</style>

<div class="header">
  <div class="header-left">
    <span class="app-label">La Vida en Directo</span>
    <h1>Estado de Servicios</h1>
    <span class="last-updated" id="ts">Comprobando…</span>
  </div>
  <button class="btn-refresh" id="refreshBtn" onclick="refresh()">
    <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <path d="M1.5 7.5a6 6 0 1 0 1.2-3.6M1.5 1v3h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Actualizar
  </button>
</div>

<div class="global-bar">
  <div class="global-dot" id="globalDot"></div>
  <span class="global-text" id="globalText">Comprobando estado…</span>
  <span class="global-sub" id="globalSub"></span>
</div>

<div class="grid" id="grid"></div>

<!-- App Stats -->
<div class="extra-section">
  <div class="section-title">App — Estadísticas</div>
  <div id="adminSaved" hidden style="display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;color:var(--fg-muted)">
    <span style="color:var(--green)">●</span> Sesión activa
    <button onclick="clearAdminToken()" style="background:none;border:none;color:var(--fg-muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0">Cerrar sesión</button>
  </div>
  <div id="adminLoginForm">
    <div class="section-form">
      <div class="field-group">
        <div class="field-label">Email admin</div>
        <input class="s-input" id="adminEmail" type="email" placeholder="tu@email.com" autocomplete="email">
      </div>
      <div class="field-group">
        <div class="field-label">Contraseña</div>
        <input class="s-input" id="adminPass" type="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <button class="btn-load" onclick="adminLogin()">Entrar</button>
    </div>
    <div id="adminLoginError" style="font-size:13px;color:var(--red);margin-top:8px;display:none"></div>
  </div>
  <input type="hidden" id="adminToken">
  <div id="appStats"></div>
</div>

<!-- Cloudinary Usage -->
<div class="extra-section">
  <div class="section-title">Cloudinary — Uso de créditos</div>
  <div class="cld-card">
    <div class="cld-card-header">
      <span class="cld-card-title">Plan activo</span>
      <span id="cldPlan" style="font-size:12px;font-weight:600;color:var(--fg-muted)">—</span>
    </div>
    <div id="cldUsage"><div class="usage-msg">Inicia sesión en Estadísticas de la App para ver el uso de Cloudinary.</div></div>
  </div>
</div>

<!-- Facturación (Render + Claude) -->
<div class="extra-section">
  <div class="section-title">Facturación — Próximos cobros</div>
  <div class="billing-cards" id="billingCards"></div>
</div>


<script>
const BACKEND = 'https://conciertos-backend.onrender.com';

const SERVICES = [
  {
    id: 'render',
    name: 'Render',
    role: 'Backend / Hosting',
    api: 'https://status.render.com/api/v2/status.json',
    page: 'https://status.render.com',
  },
  {
    id: 'cloudinary',
    name: 'Cloudinary',
    role: 'Imágenes y multimedia',
    api: 'https://status.cloudinary.com/api/v2/status.json',
    page: 'https://status.cloudinary.com',
  },
  {
    id: 'neon',
    name: 'Neon',
    role: 'Base de datos PostgreSQL',
    api: null,
    proxy: `${BACKEND}/admin/status/neon`,
    page: 'https://neonstatus.com',
  },
  {
    id: 'firebase',
    name: 'Firebase',
    role: 'Push notifications · Crashlytics',
    api: null,
    proxy: `${BACKEND}/admin/status/firebase`,
    page: 'https://status.firebase.google.com',
  },
];

function indicatorClass(ind) {
  if (!ind || ind === 'none') return 's-ok';
  if (ind === 'minor')        return 's-minor';
  if (ind === 'major')        return 's-major';
  if (ind === 'critical')     return 's-critical';
  return 's-unknown';
}
function indicatorLabel(ind) {
  if (!ind || ind === 'none') return 'Operativo';
  if (ind === 'minor')        return 'Incidencia menor';
  if (ind === 'major')        return 'Incidencia mayor';
  if (ind === 'critical')     return 'Interrupción crítica';
  return 'Desconocido';
}

function extIcon() {
  return `<svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 10 10 1M10 1H4M10 1v6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function buildCard(svc) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card-' + svc.id;
  div.innerHTML = `
    <div class="card-top">
      <div>
        <div class="card-name">${svc.name}</div>
        <div class="card-role">${svc.role}</div>
      </div>
      <div class="status-pill s-unknown" id="pill-${svc.id}">
        <div class="dot"></div>
        <span id="pill-label-${svc.id}">…</span>
      </div>
    </div>
    <div class="card-desc" id="desc-${svc.id}"><div class="shimmer"></div></div>
    <a class="card-link" href="${svc.page}" target="_blank" rel="noopener">
      Ver página de estado ${extIcon()}
    </a>`;
  return div;
}

async function fetchStatus(svc) {
  const url = svc.api || (svc.proxy ? buildProxyUrl(svc.proxy) : null);
  if (!url) {
    setPill(svc.id, 'unknown', 'Sin API pública', 'Revisa manualmente en la página de estado.');
    return { indicator: 'unknown' };
  }
  try {
    const headers = {};
    if (svc.proxy) {
      const tok = getAdminToken();
      if (!tok) {
        setPill(svc.id, 'unknown', 'Sin sesión', 'Inicia sesión en Estadísticas para ver este estado.');
        return { indicator: 'unknown' };
      }
      headers['Authorization'] = 'Bearer ' + tok;
    }
    const r = await fetch(url, { headers, signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    const ind  = data?.status?.indicator ?? 'none';
    const desc = data?.status?.description ?? indicatorLabel(ind);
    setPill(svc.id, ind, indicatorLabel(ind), desc);
    return { indicator: ind };
  } catch {
    setPill(svc.id, 'unknown', 'Sin acceso', 'No se pudo obtener el estado. Comprueba la página.');
    return { indicator: 'unknown' };
  }
}
function buildProxyUrl(u) { return u; }
function getAdminToken() {
  try {
    return document.getElementById('adminToken')?.value?.trim() || localStorage.getItem('admin_token') || '';
  } catch { return ''; }
}

function setPill(id, indicator, label, desc) {
  const pill  = document.getElementById('pill-' + id);
  const plbl  = document.getElementById('pill-label-' + id);
  const descEl = document.getElementById('desc-' + id);
  if (pill)  { pill.className = 'status-pill ' + indicatorClass(indicator); }
  if (plbl)  { plbl.textContent = label; }
  if (descEl) { descEl.textContent = desc; }
}

function updateGlobal(results) {
  const dot  = document.getElementById('globalDot');
  const text = document.getElementById('globalText');
  const sub  = document.getElementById('globalSub');
  const inds = results.map(r => r.indicator);
  const hasCritical = inds.includes('critical');
  const hasMajor    = inds.includes('major');
  const hasMinor    = inds.includes('minor');

  if (hasCritical) {
    dot.style.cssText = 'background:var(--red);box-shadow:0 0 8px var(--red)';
    text.textContent  = 'Interrupción crítica detectada';
  } else if (hasMajor) {
    dot.style.cssText = 'background:var(--accent);box-shadow:0 0 8px var(--accent)';
    text.textContent  = 'Incidencia mayor en algún servicio';
  } else if (hasMinor) {
    dot.style.cssText = 'background:var(--yellow);box-shadow:0 0 6px var(--yellow)';
    text.textContent  = 'Incidencia menor en algún servicio';
  } else {
    dot.style.cssText = 'background:var(--green);box-shadow:0 0 8px var(--green)';
    text.textContent  = 'Todos los servicios operativos';
  }
  const known = results.filter(r => r.indicator !== 'unknown').length;
  sub.textContent = `${known} de ${results.length} comprobados`;
}

function updateTimestamp() {
  const now = new Date();
  document.getElementById('ts').textContent =
    'Última actualización: ' + now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  const results = await Promise.all(SERVICES.map(fetchStatus));
  updateGlobal(results);
  updateTimestamp();
  btn.classList.remove('spinning');
  btn.disabled = false;
}



// ── App Stats ──

async function loadAppStats() {
  const token = document.getElementById('adminToken').value.trim();
  if (!token) return;
  try { localStorage.setItem('admin_token', token); } catch {}

  const el = document.getElementById('appStats');
  el.innerHTML = '<div class="shimmer" style="height:100px;width:100%;border-radius:10px;margin-top:14px"></div>';

  try {
    const headers = { Authorization: 'Bearer ' + token };
    const [statsRes, usersRes] = await Promise.all([
      fetch(`${BACKEND}/admin/stats`, { headers, signal: AbortSignal.timeout(15000) }),
      fetch(`${BACKEND}/admin/users?take=500`, { headers, signal: AbortSignal.timeout(15000) }),
    ]);
    if (!statsRes.ok) throw new Error('HTTP ' + statsRes.status + ' — comprueba que el token sea de admin');
    const s = await statsRes.json();
    const u = usersRes.ok ? await usersRes.json() : null;
    const usersErr = usersRes.ok ? null : `HTTP ${usersRes.status} al cargar usuarios`;

    const users   = s.users   || {};
    const content = s.content || {};
    const health  = s.health  || {};

    const fmt = n => n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : n;
    const uptimeH = Math.floor((health.uptimeSec || 0) / 3600);

    const kpis = [
      { label: 'Usuarios totales', value: fmt(users.total || 0), cls: '', sub: '' },
      { label: 'Nuevos esta semana', value: fmt(users.new7d || 0), cls: 'green', sub: `${fmt(users.new30d||0)} este mes` },
      { label: 'Activos 7 días', value: fmt(users.active7d || 0), cls: 'accent', sub: `${fmt(users.active30d||0)} activos 30d` },
      { label: 'Usuarios Pro', value: fmt(users.pro || 0), cls: 'gold', sub: `de ${fmt(users.total||0)}` },
      { label: 'Conciertos', value: fmt(content.concerts || 0), cls: '', sub: `media valoración ${(content.avgRating||0).toFixed(1)}★` },
      { label: 'DB respuesta', value: (health.dbMs || 0) + 'ms', cls: (health.dbMs||0) < 100 ? 'green' : 'accent', sub: `uptime ${uptimeH}h` },
    ];

    // Signup sparkline (last 14 days)
    const signups = (s.activity?.signups || []).slice(-14);
    const maxSig = Math.max(1, ...signups.map(d => d.count));
    const sparkHtml = signups.length > 1 ? `
      <div class="stats-signup-chart">
        <div class="stats-users-title">Registros últimos 14 días</div>
        <div class="chart-bars">
          ${signups.map(d => {
            const pct = Math.round(d.count / maxSig * 100);
            const dayLabel = new Date(d.day).toLocaleDateString('es-ES', { day:'numeric', month:'short' });
            return `<div class="chart-bar-wrap" title="${d.count} el ${dayLabel}">
              <div class="chart-bar" style="height:${Math.max(4, pct * 0.6)}px"></div>
              <div class="chart-label">${d.count}</div>
            </div>`;
          }).join('')}
        </div>
      </div>` : '';

    // All users
    const items = u?.items || [];
    const renderUsers = (list) => list.map(usr => {
      const initials = (usr.name || '?').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
      const avatarInner = usr.avatarUrl
        ? `<img src="${usr.avatarUrl}" alt="" loading="lazy">`
        : initials;
      const badge = usr.isAdmin ? '<span class="user-badge admin">Admin</span>'
                  : usr.isPro   ? '<span class="user-badge">Pro</span>' : '';
      const joined = new Date(usr.createdAt).toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'2-digit' });
      const platIcon = usr.platform === 'ios' ? '🍎' : usr.platform === 'android' ? '🤖' : '📱';
      const verStr = usr.appVersion ? `${platIcon} v${usr.appVersion} (build ${usr.appBuild ?? '—'})` : `${platIcon} sin versión`;
      const stats = [
        usr.concertCount   ? `🎵 ${usr.concertCount}` : null,
        usr.photoCount     ? `📷 ${usr.photoCount}` : null,
        usr.commentCount   ? `💬 ${usr.commentCount}` : null,
        usr.recordCount    ? `💿 ${usr.recordCount}` : null,
        usr.wantToAttendCount ? `🎟 ${usr.wantToAttendCount}` : null,
      ].filter(Boolean);
      return `<div class="user-row">
        <div class="user-avatar">${avatarInner}</div>
        <div class="user-info">
          <div class="user-name">${usr.name || '—'} ${badge}</div>
          <div class="user-email">${usr.email} · ${joined}</div>
          <div class="user-version">${verStr}</div>
          ${stats.length ? `<div class="user-stats">${stats.map(st => `<span class="user-stat">${st}</span>`).join('')}</div>` : ''}
        </div>
      </div>`;
    }).join('');

    const usersHtml = usersErr
      ? `<div class="stats-users-list"><div class="stats-users-title" style="color:var(--red)">❌ ${usersErr}</div></div>`
      : items.length ? `
      <div class="stats-users-list" id="userListWrap">
        <div class="stats-users-title">Todos los usuarios (${items.length})</div>
        <input class="user-search" id="userSearch" type="search" placeholder="Buscar por nombre o email…" oninput="filterUsers(this.value)">
        <div id="userList">${renderUsers(items)}</div>
      </div>` : `<div class="stats-users-list"><div class="stats-users-title" style="color:var(--fg-muted)">Sin usuarios</div></div>`;

    // Store items globally for search
    window._adminUsers = items;
    window._renderUsers = renderUsers;

    // Hide form, show saved badge
    try {
      document.getElementById('adminLoginForm').style.display = 'none';
      document.getElementById('adminSaved').hidden = false;
    } catch {}

    // Versions breakdown — include null versions (devices that haven't reported yet)
    const versions = (s.versions || [])
      .sort((a, b) => (b.build || 0) - (a.build || 0));
    const totalDevices = versions.reduce((sum, v) => sum + v.devices, 0) || 1;
    const versionsHtml = versions.length ? `
      <div style="margin-top:20px">
        <div class="stats-users-title">Versiones de la app en uso (${totalDevices} dispositivos)</div>
        <div class="versions-grid">
          ${versions.map(v => {
            const p = Math.round(v.devices / totalDevices * 100);
            const cls = p >= 50 ? 'green' : 'gold';
            const verLabel = v.version || 'Sin versión';
            const buildLabel = v.build != null ? `build ${v.build}` : 'build —';
            return `<div class="version-card">
              <div class="version-num">${verLabel}</div>
              <div class="version-build">${buildLabel}</div>
              <div class="version-devices">${v.devices} dispositivo${v.devices !== 1 ? 's' : ''} · ${p}%</div>
              <div class="usage-track" style="margin-top:4px"><div class="usage-fill ${cls}" style="width:${p}%"></div></div>
            </div>`;
          }).join('')}
        </div>
      </div>` : '<div class="usage-msg" style="margin-top:12px">Sin datos de versiones — los dispositivos deben registrar su token de notificaciones para reportar la versión.</div>';

    el.innerHTML = `
      <div class="stats-kpi-grid">${kpis.map(k =>
        `<div class="kpi-card">
          <div class="kpi-label">${k.label}</div>
          <div class="kpi-value ${k.cls}">${k.value}</div>
          ${k.sub ? `<div class="kpi-sub">${k.sub}</div>` : ''}
        </div>`).join('')}
      </div>
      ${versionsHtml}
      ${sparkHtml}
      ${usersHtml}`;
  } catch (e) {
    el.innerHTML = `<div style="color:var(--red);padding-top:12px;font-size:13px">❌ Error: ${e.message}<br><small style="color:var(--fg-muted)">${e.stack?.split('\n')[1] || ''}</small></div>`;
  }
}

async function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pass  = document.getElementById('adminPass').value;
  const errEl = document.getElementById('adminLoginError');
  const btn   = document.querySelector('#adminLoginForm .btn-load');
  if (!email || !pass) return;

  errEl.style.display = 'none';
  btn.textContent = 'Entrando…';
  btn.disabled = true;

  try {
    let r, data;
    try {
      r = await fetch(`${BACKEND}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
        signal: AbortSignal.timeout(12000),
      });
      data = await r.json();
    } catch (fetchErr) {
      throw new Error('No se pudo conectar con el servidor. Posible bloqueo CORS — prueba desde la app directamente.');
    }
    if (!r.ok) throw new Error(data.message || `Error ${r.status}: credenciales incorrectas`);
    const token = data.token || data.accessToken;
    if (!token) throw new Error('El servidor no devolvió token');

    try { localStorage.setItem('admin_token', token); } catch {}
    document.getElementById('adminToken').value = token;
    document.getElementById('adminPass').value = '';
    document.getElementById('adminLoginForm').style.display = 'none';
    document.getElementById('adminSaved').hidden = false;
    loadAppStats();
    loadCloudinaryUsage();
    refresh();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Entrar';
    btn.disabled = false;
  }
}

function clearAdminToken() {
  try { localStorage.removeItem('admin_token'); } catch {}
  document.getElementById('adminToken').value = '';
  document.getElementById('adminSaved').hidden = true;
  document.getElementById('adminLoginForm').style.display = '';
  document.getElementById('appStats').innerHTML = '';
}

// ── Cloudinary Usage (via backend proxy) ──
async function loadCloudinaryUsage() {
  const token = document.getElementById('adminToken').value.trim();
  const el = document.getElementById('cldUsage');
  if (!token) return;

  el.innerHTML = '<div class="shimmer" style="height:80px;width:100%;border-radius:10px;margin-top:14px"></div>';

  try {
    const r = await fetch(`${BACKEND}/admin/cloudinary/usage`, {
      headers: { Authorization: 'Bearer ' + token },
      signal: AbortSignal.timeout(12000),
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'HTTP ' + r.status);

    const fmtBytes = b => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(1)+' MB' : (b/1e3).toFixed(0)+' KB';
    const fmtNum  = n => n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'k' : n;
    const pct = (used, limit) => limit ? Math.min(100, Math.round(used / limit * 100)) : 0;
    const colorClass = p => p >= 85 ? '' : p >= 60 ? 'gold' : 'green';

    const rows = [
      { label: 'Almacenamiento', used: d.storage?.usage, limit: d.storage?.limit, fmt: fmtBytes },
      { label: 'Transformaciones', used: d.transformations?.usage, limit: d.transformations?.limit, fmt: fmtNum },
      { label: 'Ancho de banda', used: d.bandwidth?.usage, limit: d.bandwidth?.limit, fmt: fmtBytes },
      { label: 'Imágenes / recursos', used: d.resources, limit: d.objects?.limit, fmt: fmtNum },
    ].filter(row => row.used != null);

    // Show plan
    try { document.getElementById('cldPlan').textContent = d.plan || '—'; } catch {}

    el.innerHTML = '<div class="usage-display">' + rows.map(row => {
      const p = pct(row.used, row.limit);
      const cls = colorClass(p);
      const valStr = row.limit ? `${row.fmt(row.used)} / ${row.fmt(row.limit)} (${p}%)` : row.fmt(row.used);
      return `<div class="usage-row">
        <div class="usage-row-top"><span class="usage-label">${row.label}</span><span class="usage-val">${valStr}</span></div>
        ${row.limit ? `<div class="usage-track"><div class="usage-fill ${cls}" style="width:${p}%"></div></div>` : ''}
      </div>`;
    }).join('') + '</div>';
  } catch (e) {
    el.innerHTML = `<div class="usage-msg" style="color:var(--red)">${e.message}</div>`;
  }
}

// ── Billing countdown ──
const BILLING = [
  { id: 'render',    label: 'Render',           lsKey: 'bill_render_day',    defaultDay: 1,  url: 'https://dashboard.render.com/billing' },
  { id: 'anthropic', label: 'Anthropic / Claude', lsKey: 'bill_claude_day',  defaultDay: 1,  url: 'https://console.anthropic.com/settings/billing' },
];

function nextBillingDate(day) {
  const now = new Date();
  let d = new Date(now.getFullYear(), now.getMonth(), day);
  if (d <= now) d = new Date(now.getFullYear(), now.getMonth() + 1, day);
  return d;
}
function daysUntil(date) {
  return Math.ceil((date - new Date()) / 86400000);
}
function buildBillingCards() {
  const container = document.getElementById('billingCards');
  container.innerHTML = '';
  BILLING.forEach(b => {
    let day = b.defaultDay;
    try { const s = localStorage.getItem(b.lsKey); if (s) day = parseInt(s) || day; } catch {}
    renderBillingCard(container, b, day);
  });
}
function renderBillingCard(container, b, day) {
  const next = nextBillingDate(day);
  const days = daysUntil(next);
  const month = next.toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
  const urgentClass = days <= 7 ? '' : 'ok';

  const card = document.createElement('div');
  card.className = 'billing-card';
  card.id = 'bccard-' + b.id;
  card.innerHTML = `
    <div class="billing-service">${b.label}</div>
    <div class="billing-countdown ${urgentClass}">${days} días</div>
    <div class="billing-date">Próximo cobro: <a href="${b.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${month} ↗</a></div>
    <div class="billing-day-row">
      Día de cobro:
      <input type="number" min="1" max="28" value="${day}" id="bday-${b.id}" onchange="saveBillingDay('${b.id}', this.value)">
    </div>`;
  container.appendChild(card);
}
function saveBillingDay(id, val) {
  const b = BILLING.find(x => x.id === id);
  if (!b) return;
  const day = Math.min(28, Math.max(1, parseInt(val) || 1));
  try { localStorage.setItem(b.lsKey, day); } catch {}
  const container = document.getElementById('billingCards');
  const old = document.getElementById('bccard-' + id);
  if (old) old.remove();
  renderBillingCard(container, b, day);
}

// ── Init ──
(function init() {
  const grid = document.getElementById('grid');
  SERVICES.forEach(svc => grid.appendChild(buildCard(svc)));

  // Restore admin token — from URL hash (#t=…) or localStorage
  try {
    const hashToken = new URLSearchParams(location.hash.slice(1)).get('t');
    if (hashToken) {
      localStorage.setItem('admin_token', hashToken);
      // Clean hash from URL without reload
      history.replaceState(null, '', location.pathname + location.search);
    }
    const tok = hashToken || localStorage.getItem('admin_token');
    if (tok) {
      document.getElementById('adminToken').value = tok;
      document.getElementById('adminLoginForm').style.display = 'none';
      document.getElementById('adminSaved').hidden = false;
      loadAppStats();
      loadCloudinaryUsage();
    }
  } catch {}

  // Billing cards

  buildBillingCards();

  refresh();
  setInterval(refresh, 60000);
})();

function filterUsers(q) {
  const list = window._adminUsers || [];
  const render = window._renderUsers;
  if (!render) return;
  const term = q.trim().toLowerCase();
  const filtered = term ? list.filter(u =>
    (u.name || '').toLowerCase().includes(term) ||
    (u.email || '').toLowerCase().includes(term)
  ) : list;
  const el = document.getElementById('userList');
  if (el) el.innerHTML = render(filtered);
}
